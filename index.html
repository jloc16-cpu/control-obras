<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

</head><body><div id="app"></div>
<script>
/* ===== ENGINE_START ===== */
const CATS = ["Materiales", "Mano de obra", "Transporte y combustible", "Herramientas y equipos", "Subcontratos", "Otros gastos"];
const CATS_GG = ["Alquiler de oficina", "Servicios básicos", "Internet y telefonía", "Contabilidad y legal", "Papelería y oficina", "Movilidad", "Marketing", "Impuestos y tasas", "Otros generales"];
const ESTADOS = ["Por iniciar", "Iniciado", "En proceso", "En pausa", "Finalizado", "Entregado"];
const FORMAS = ["Efectivo", "Transferencia", "Cheque", "QR / Tarjeta"];
const TIPOS_PLANILLA = ["Anticipo", "Planilla de avance", "Pago final", "Otro cobro"];
const CONC_UTIL = ["Anticipo de utilidad", "Pago por avance", "Pago final de utilidad"];
const OFICIOS = ["Maestro albañil", "Albañil", "Ayudante", "Armador", "Carpintero", "Electricista", "Plomero", "Pintor", "Soldador", "Peón"];

const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const D = s => { if (!s) return null; const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) / 86400000 : null; };
const iso = dn => new Date(dn * 86400000).toISOString().slice(0, 10);
const mondayOf = dn => dn - ((dn + 3) % 7 + 7) % 7;
const todayDn = () => { const d = new Date(); return Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000; };
const fmt = (n, d = 2) => (isFinite(n) ? Number(n) : 0).toLocaleString("es-BO", { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtBs = n => "Bs " + fmt(n, 2);
const fmtDate = s => { if (!s) return "—"; const [y, m, d] = s.split("-"); return d + "/" + m + "/" + y; };
const pct = (n, d = 1) => fmt((n || 0) * 100, d) + "%";

function emptyState() {
  return {
    v: 1,
    config: { empresa: "Mi empresa constructora", nit: "", representante: "", direccion: "", ciudad: "", telefono: "", correo: "", web: "", logo: "", inicio: iso(mondayOf(todayDn())), diasAlerta: 15, tol: 0.10, umbral: 0.90, avMin: 0.10, prorratearGG: true, iva: 0.13, it: 0.03,
              sueldos: { gerente: 1000, contadora: 1000, ingeniero: 1000 } },
    projects: [], items: [], cambios: [], movs: [], obreros: [], gg: [], planillas: [], cobros: [], nomina: [], pagosUtil: [], avance: [], roles: {}
  };
}

/* ---- motor: calcula todo a partir del estado ---- */
function compute(S, today) {
  const C = S.config, start = D(C.inicio) != null ? mondayOf(D(C.inicio)) : mondayOf(today);
  const weekIdx = dn => Math.floor((dn - start) / 7) + 1;
  const out = { today, start, curWeek: Math.max(1, weekIdx(today)), proj: [], byId: {}, warnings: [] };
  const pById = {}; S.projects.forEach(p => pById[p.id] = p);
  const P = S.projects.map(p => {
    const monto = num(p.monto);
    const camb = S.cambios.filter(c => c.pid === p.id && D(c.fecha) != null && D(c.fecha) <= today).reduce((a, c) => a + (c.tipo === "Deductivo" ? -Math.abs(num(c.monto)) : Math.abs(num(c.monto))), 0);
    const ief = D(p.ini_r) != null ? D(p.ini_r) : (D(p.ini_p) != null ? D(p.ini_p) : null);
    const fef = D(p.fin_r);
    return { p, monto, camb, vig: monto + camb, ief, fef, mat: 0, mo: 0, otr: 0, sue: 0, ggs: 0, wcost: {} };
  });
  const byId = {}; P.forEach(x => byId[x.p.id] = x); out.byId = byId; out.proj = P;
  const addW = (x, wk, v) => { x.wcost[wk] = (x.wcost[wk] || 0) + v; };
  const wkTot = {};     // gasto por semana (empresa)
  const bump = (wk, k, v) => { (wkTot[wk] = wkTot[wk] || { mat: 0, mo: 0, otr: 0, sue: 0, gg: 0, cob: 0 })[k] += v; };
  let sinProyecto = 0, gastoMov = 0, porPagar = 0;
  // movimientos de obra
  S.movs.forEach(m => {
    const v = num(m.monto), x = byId[m.pid], wk = D(m.fecha) != null ? weekIdx(D(m.fecha)) : 0;
    gastoMov += v; if (m.pago === "Pendiente") porPagar += v;
    if (!x) { sinProyecto += v; return; }
    const k = m.cat === "Materiales" ? "mat" : m.cat === "Mano de obra" ? "mo" : "otr";
    x[k] += v; addW(x, wk, v); bump(wk, k, v);
  });
  // obreros (detalle)
  const obrTotal = o => num(o.dias) * num(o.jornal) + num(o.bonos) - num(o.descuentos);
  S.obreros.forEach(o => {
    const v = obrTotal(o), x = byId[o.pid], wk = D(o.fecha) != null ? weekIdx(D(o.fecha)) : 0;
    gastoMov += v; if (o.pago === "Pendiente") porPagar += v;
    if (!x) { sinProyecto += v; return; }
    x.mo += v; addW(x, wk, v); bump(wk, "mo", v);
    const dup = S.movs.some(m => m.pid === o.pid && m.cat === "Mano de obra" && D(m.fecha) != null && D(o.fecha) != null && weekIdx(D(m.fecha)) === weekIdx(D(o.fecha)));
    if (dup) out.warnings.push("Mano de obra cargada dos veces (Movimientos y Obreros) en " + x.p.nombre + " semana " + weekIdx(D(o.fecha)) + ".");
  });
  // sueldos y gastos generales: prorrateo semanal
  const weeks = {};
  S.nomina.forEach(n => { if (n.estado) weeks[weekIdx(D(n.semana))] = weeks[weekIdx(D(n.semana))] || {}; });
  S.gg.forEach(g => { if (D(g.fecha) != null) weeks[weekIdx(D(g.fecha))] = weeks[weekIdx(D(g.fecha))] || {}; });
  let nominaTotal = 0, nominaPend = 0, ggTotal = 0, ggPend = 0, sueSinAsignar = 0, ggSinAsignar = 0;
  const nomByWk = {}; S.nomina.forEach(n => { if (n.estado) nomByWk[weekIdx(D(n.semana))] = n; });
  Object.keys(weeks).map(Number).forEach(wk => {
    const wkS = start + 7 * (wk - 1), wkE = wkS + 6;
    const w = P.map(x => {
      const act = (x.ief == null || x.ief <= wkE) && (x.fef == null || x.fef >= wkS);
      const camb = S.cambios.filter(c => c.pid === x.p.id && D(c.fecha) != null && D(c.fecha) <= wkE).reduce((a, c) => a + (c.tipo === "Deductivo" ? -Math.abs(num(c.monto)) : Math.abs(num(c.monto))), 0);
      return act ? Math.max(0, x.monto + camb) : 0;
    });
    const sw = w.reduce((a, b) => a + b, 0);
    const n = nomByWk[wk];
    if (n) {
      const tot = num(n.g != null ? n.g : C.sueldos.gerente) + num(n.c != null ? n.c : C.sueldos.contadora) + num(n.i != null ? n.i : C.sueldos.ingeniero);
      nominaTotal += tot; if (n.estado === "Pendiente") nominaPend += tot;
      if (sw > 0) P.forEach((x, i) => { const v = tot * w[i] / sw; x.sue += v; addW(x, wk, v); }); else sueSinAsignar += tot;
      bump(wk, "sue", tot);
    }
    const ggw = S.gg.filter(g => D(g.fecha) != null && weekIdx(D(g.fecha)) === wk).reduce((a, g) => a + num(g.monto), 0);
    if (ggw > 0) {
      bump(wk, "gg", ggw);
      if (C.prorratearGG) { if (sw > 0) P.forEach((x, i) => { const v = ggw * w[i] / sw; x.ggs += v; addW(x, wk, v); }); else ggSinAsignar += ggw; }
    }
  });
  S.gg.forEach(g => { ggTotal += num(g.monto); if (g.pago === "Pendiente") ggPend += num(g.monto); });
  // cobranza
  const planRows = S.planillas.map(pl => {
    const x = byId[pl.pid], ret = x && pl.tipo === "Planilla de avance" ? num(pl.monto) * num(x.p.retPct) : 0;
    const neto = num(pl.monto) - ret;
    const cob = S.cobros.filter(c => c.pid === pl.pid && String(c.nro).trim() === String(pl.nro).trim() && String(pl.nro).trim() !== "").reduce((a, c) => a + num(c.monto), 0);
    const saldo = Math.max(0, neto - cob), lim = D(pl.limite);
    const venc = saldo > 0.005 && lim != null && lim < today ? saldo : 0;
    return { pl, ret, neto, cob, saldo, estado: saldo <= 0.005 ? "Cobrada" : cob > 0 ? "Cobro parcial" : "Pendiente", venc, atraso: venc > 0 ? today - lim : 0 };
  });
  out.planRows = planRows;
  // por proyecto
  P.forEach(x => {
    const p = x.p, id = p.id;
    x.cos = x.mat + x.mo + x.sue + x.ggs + x.otr; x.sal = x.vig - x.cos; x.pcon = x.vig > 0 ? x.cos / x.vig : 0;
    x.cob = S.cobros.filter(c => c.pid === id).reduce((a, c) => a + num(c.monto), 0); x.cja = x.cob - x.cos;
    const fin = p.estado === "Finalizado" || p.estado === "Entregado", avn = num(p.avance);
    x.avn = avn; x.fin = fin;
    x.cpy = fin ? x.cos : (avn >= C.avMin && avn > 0 ? x.cos / avn : x.cos); x.mpy = x.vig - x.cpy; x.mpc = x.vig > 0 ? x.mpy / x.vig : 0; x.dsv = avn - x.pcon;
    const fc = D(p.fin_c); x.dre = fc == null ? null : (fin ? 0 : fc - today);
    const ini = D(p.ini_p); x.plazo = fc != null && ini != null ? fc - ini : null;
    x.dtr = x.ief == null ? null : Math.max(0, (x.fef != null ? x.fef : today) - x.ief);
    let sem;
    if (fin) sem = "FINALIZADO"; else if (p.estado === "Por iniciar") sem = "POR INICIAR"; else if (p.estado === "En pausa") sem = "EN PAUSA";
    else if (x.cos > x.vig || (x.dre != null && x.dre < 0)) sem = "CRÍTICO";
    else if ((x.dre != null && x.dre <= C.diasAlerta) || x.pcon - avn > C.tol || x.pcon >= C.umbral || x.cpy > x.vig) sem = "ALERTA"; else sem = "NORMAL";
    x.sem = sem;
    x.apl = fin ? "Cerrado" : x.dre == null ? "Sin fecha de fin" : x.dre < 0 ? "VENCIDO hace " + (-x.dre) + " días" : x.dre <= C.diasAlerta ? "Vence en " + x.dre + " días" : "En plazo";
    const pr = planRows.filter(r => r.pl.pid === id);
    x.emi = pr.reduce((a, r) => a + num(r.pl.monto), 0); x.pcb = pr.reduce((a, r) => a + r.saldo, 0); x.ven = pr.reduce((a, r) => a + r.venc, 0); x.rtn = pr.reduce((a, r) => a + r.ret, 0); x.pfa = x.vig - x.emi;
    // utilidad
    const u = {}; u.obj = x.vig * num(p.utilPct); u.ing = u.obj * num(p.ingPct); u.neta = u.obj - u.ing; u.av = fin ? 1 : avn; u.dev = u.ing * u.av;
    u.pag = S.pagosUtil.filter(c => c.pid === id).reduce((a, c) => a + num(c.monto), 0); u.saldo = u.ing - u.pag; u.exig = Math.max(0, u.dev - u.pag); u.holg = x.mpy - u.obj;
    u.sit = u.holg >= 0 ? "✔ El margen cubre la utilidad objetivo" : "⚠ Faltan Bs " + Math.round(-u.holg) + " para la utilidad objetivo"; x.u = u;
    // ítems
    x.items = S.items.filter(i => i.pid === id).map(i => {
      const pres = num(i.cant) * num(i.pu), gast = S.movs.filter(m => m.itemId === i.id).reduce((a, m) => a + num(m.monto), 0);
      const lp = pres > 0 ? gast / pres : 0, ia = num(i.avance);
      return { i, pres, gast, saldo: pres - gast, lp, alerta: gast > pres && pres > 0 ? "⚠ Excede el presupuesto" : (i.avance != null && i.avance !== "" && lp - ia > C.tol ? "⚠ Gasto mayor al avance" : "✔ En orden") };
    });
    x.presItems = x.items.reduce((a, r) => a + r.pres, 0);
  });
  // totales

function drawCharts() {
  CH.forEach(c => { try { c.destroy(); } catch (e) { } }); CH = []; if (typeof Chart === "undefined") return;
  const dark = matchMedia("(prefers-color-scheme: dark)").matches, tc = dark ? "#cfd6e8" : "#445", gc = dark ? "#2a3452" : "#e3e7f0"; Chart.defaults.color = tc;
  const mk = (id, cfg) => { const el = document.getElementById(id); if (!el) return; cfg.options = Object.assign({ responsive: true, maintainAspectRatio: false, plugins: { legend: { position: "bottom", labels: { boxWidth: 10 } } }, scales: { x: { stacked: cfg.stacked, grid: { color: gc } }, y: { stacked: cfg.stacked, grid: { color: gc }, ticks: { callback: v => cfg.pct ? v + "%" : fmt(v, 0) } } } }, cfg.options || {}); CH.push(new Chart(el, cfg)); };
  const pal = ["#122A50", "#EE6225", "#2A9D8F", "#E9C46A", "#8D99AE"], names = R.proj.map(x => x.p.nombre);
  mk("ch1", { type: "bar", stacked: true, data: { labels: names, datasets: [["Materiales", "mat"], ["Mano de obra", "mo"], ["Sueldos", "sue"], ["Gastos generales", "ggs"], ["Otros", "otr"]].map((a, i) => ({ label: a[0], data: R.proj.map(x => x[a[1]]), backgroundColor: pal[i] })) } });
  mk("ch2", { type: "bar", pct: true, data: { labels: names, datasets: [{ label: "Avance físico", data: R.proj.map(x => +(x.avn * 100).toFixed(1)), backgroundColor: "#2A9D8F" }, { label: "% consumido", data: R.proj.map(x => +(x.pcon * 100).toFixed(1)), backgroundColor: "#EE6225" }] } });
  mk("ch3", { type: "bar", stacked: true, data: { labels: R.last12.map(r => "S" + r.w), datasets: [["Materiales", "mat"], ["Mano de obra", "mo"], ["Otros", "otr"], ["Sueldos", "sue"], ["Gastos generales", "gg"]].map((a, i) => ({ label: a[0], data: R.last12.map(r => r[a[1]]), backgroundColor: pal[i] })) } });
  if (VIEW.tab === "proyectos" && VIEW.pid && VIEW.sub === "avance") { const c = R.curve(VIEW.pid); mk("chS", { type: "line", pct: true, data: { labels: c.map(r => "S" + r.w), datasets: [["Programado", "prog", "#EE6225"], ["Real (físico)", "real", "#2A9D8F"], ["Financiero (gasto)", "fin", "#122A50"]].map(a => ({ label: a[0], data: c.map(r => r[a[1]] == null ? null : +(r[a[1]] * 100).toFixed(1)), borderColor: a[2], backgroundColor: a[2], tension: .2, pointRadius: 2, spanGaps: false })) }, options: { scales: { y: { min: 0, suggestedMax: 100, ticks: { callback: v => v + "%" } } } } }); }
}

/* ---- armado de pantalla y eventos ---- */
function render() {
  if (!S) return; const y = window.scrollY, t = VIEW.tab; let body = "", title = "Panel";
  if (t === "panel") { body = vPanel(); title = esc(S.config.empresa); } else if (t === "proyectos") { body = VIEW.pid ? vProyecto(VIEW.pid) : vProyectos(); title = VIEW.pid ? "Proyecto" : "Proyectos"; } else if (t === "cobranza") { body = vCobranza(); title = "Cobranza"; } else { body = vMas(); title = "Más"; }
  const nav = [["panel", "📊", "Panel"], ["proyectos", "🏗️", "Proyectos"], ["+", "+", ""], ["cobranza", "💵", "Cobranza"], ["mas", "☰", "Más"]];
  const nAl = R.alerts.filter(a => a.n === "r").length;
  $("#app").innerHTML = '<div class="top">' + (t === "proyectos" && VIEW.pid ? '<button class="btn g s" data-act="back">←</button>' : "") + (safeLogo() ? '<img class="lg" src="' + safeLogo() + '" alt="">' : "") + "<h1>" + title + "<small>" + (Sync.on ? "☁ modo compartido · " + ROLES[myRole()] : "Datos en este dispositivo") + " · " + fmtDate(iso(R.today)) + '</small></h1><button class="btn g s no-print" data-act="xlsx" title="Exportar a Excel">⬇ Excel</button></div>' + body +
    '<nav class="nav">' + nav.map(n => n[0] === "+" ? '<button class="plus" data-act="quick"><span>+</span></button>' : '<button data-act="tab" data-t="' + n[0] + '" class="' + (t === n[0] ? "on" : "") + '"><span>' + n[1] + "</span>" + n[2] + (n[0] === "panel" && nAl ? '<i class="badge">' + nAl + "</i>" : "") + "</button>").join("") + "</nav>";
  drawCharts(); window.scrollTo(0, y);
  const cf = $("#cf"); if (cf) cf.addEventListener("submit", saveConfig); wireEmpresa();
  const us = $("#usq"); if (us) { const run = async () => { const q = us.value; if (!Sync.user || !Sync.user.search) return; try { const hits = await Sync.user.search(q); $("#ush").innerHTML = (hits || []).slice(0, 6).map(h => '<button class="btn g s" style="margin:3px" data-adduser="' + esc(h.id) + '">+ ' + esc(h.name || h.id.slice(0, 6)) + "</button>").join(""); } catch (e) { } }; us.addEventListener("focus", run); us.addEventListener("input", run); }
  if (Sync.user && Sync.user.profiles) { const ids = Object.keys(S.roles || {}); if (ids.length) Sync.user.profiles(ids).then(ps => ids.forEach(id => { const e = document.getElementById("u_" + id); if (e && ps[id] && ps[id].name) e.textContent = ps[id].name; })).catch(() => { }); }
}
function saveConfig(e) {
  e.preventDefault(); const f = e.target.elements, c = S.config; if (f.inicio.value) c.inicio = iso(mondayOf(D(f.inicio.value)));
  c.diasAlerta = num(f.diasAlerta.value); c.tol = num(f.tol.value) / 100; c.umbral = num(f.umbral.value) / 100; c.avMin = num(f.avMin.value) / 100; c.prorratearGG = f.prorratearGG.checked; c.iva = num(f.iva.value) / 100; c.it = num(f.it.value) / 100;
  c.sueldos = { gerente: num(f.sg.value), contadora: num(f.sc.value), ingeniero: num(f.si.value) }; if (f.rolLocal) c.rolLocal = f.rolLocal.value; persist(); Sync.writeConfig(); recompute(); render(); toast("Configuración guardada.");
}
const ACT = {
  tab: t => { VIEW.tab = t.dataset.t; VIEW.pid = null; VIEW.page = null; render(); }, back: () => { VIEW.pid = null; render(); }, quick: quickMenu, newProj: newProjChooser,
  openProj: t => { VIEW.tab = "proyectos"; VIEW.pid = t.dataset.id; VIEW.sub = "resumen"; render(); }, sub: t => { VIEW.sub = t.dataset.s; render(); },
  add: t => { const k = t.dataset.kind; editRec(k, null, t.dataset.pid ? { pid: t.dataset.pid } : (VIEW.pid ? { pid: VIEW.pid } : {})); }, edit: t => editRec(t.dataset.kind, t.dataset.id),
  imp: t => importBudget(t.dataset.m, { pid: VIEW.pid }), page: t => { VIEW.page = t.dataset.p || null; render(); }, nom: t => editRec("nomina", S.nomina.find(n => n.semana === t.dataset.w) ? t.dataset.w : null, { semana: t.dataset.w, estado: "Pagado" }),
  wk: () => { VIEW.week = Math.max(1, num($("#wkin").value)); render(); }, pdfReport: () => reportPDF(), print: () => { try { window.print(); } catch (e) { toast("Imprimir no está disponible aquí; usa «Descargar PDF»."); } },
  xlsx: () => exportExcel(), jsonx: () => exportJSON(),
  ximp: async () => { const f = await pickFile(".xlsx"); if (!f) return; try { const N = await importExcel(f); if (confirm("Esto reemplaza los datos actuales por los del Excel (" + N.projects.length + " proyectos). ¿Continuar?")) { try { localStorage.setItem(KEY + "_prev", JSON.stringify(S)); } catch (e) { } S = N; persist(); recompute(); render(); toast("Datos importados."); } } catch (e) { toast(e.message || "No se pudo importar."); } },
  jsoni: async () => { const f = await pickFile(".json"); if (!f) return; try { const o = JSON.parse(await f.text()); if (confirm("Esto reemplaza los datos actuales. ¿Continuar?")) { S = Object.assign(emptyState(), o); persist(); recompute(); render(); toast("Copia restaurada."); } } catch (e) { toast("Archivo no válido."); } },
  sample: () => { if (S.projects.length && !confirm("Esto reemplaza tus datos actuales por el ejemplo (se guarda una copia). ¿Continuar?")) return; try { localStorage.setItem(KEY + "_prev", JSON.stringify(S)); } catch (e) { } S = sampleData(); persist(); recompute(); VIEW.tab = "panel"; render(); },
  wipe: () => { if (!confirm("¿Borrar TODOS los datos de este dispositivo?")) return; try { localStorage.setItem(KEY + "_prev", JSON.stringify(S)); } catch (e) { } S = emptyState(); persist(); recompute(); VIEW.tab = "panel"; VIEW.pid = null; render(); },
  syncon: () => Sync.enable(true), syncoff: () => Sync.disable(), syncup: () => Sync.upload()
};
function boot() {
  S = loadLocal(); recompute(); render();
  document.addEventListener("click", e => { const t = e.target.closest("[data-act]"); if (t && ACT[t.dataset.act]) { e.preventDefault(); ACT[t.dataset.act](t, e); return; }
    const au = e.target.closest("[data-adduser]"); if (au) { S.roles = S.roles || {}; S.roles[au.dataset.adduser] = "consulta"; Sync.saveRoles(); render(); } });
  document.addEventListener("change", e => { const r = e.target.closest("[data-role]"); if (r) { S.roles[r.dataset.role] = r.value; Sync.saveRoles(); toast("Rol actualizado."); } });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
  Sync.init();
}
/* ===== VIEWS_END ===== */
if (typeof document !== "undefined" && document.getElementById("app")) boot();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script></body></html>
